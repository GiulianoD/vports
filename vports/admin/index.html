<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Validação de Registros</title>
  <!-- Meta tags para evitar cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- ======== CSS ======== -->
  <link rel="stylesheet" href="style.css?v=1.1">
  <link rel="stylesheet" href="../form/navbar.css?v=1.1">
</head>
<body>
  <!-- NAV: Menu responsivo -->
  <nav class="top-nav" aria-label="Menu principal">
    <div class="nav-inner">
      <!-- Logo esquerda -->
      <div class="nav-logo-left">
        <img src="/vports/res/evl/logo.200.png"
            alt="Logo EVL" class="logo-left">
      </div>

      <!-- Botão hambúrguer (mobile) -->
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Abrir menu">
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
      </button>

      <!-- Links centrais - APENAS LOGOUT -->
      <ul id="navLinks" class="nav-links">
        <!-- Botão de Logout -->
        <li class="logout-item">
          <button id="btnLogout" class="btn-logout" title="Sair do sistema">
            <span class="logout-text">Sair</span>
          </button>
        </li>
      </ul>
      
      <!-- Modal de Confirmação de Logout -->
      <div id="logoutModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-icon">🚪</div>
          <h3 class="modal-title">Sair do Sistema</h3>
          <p class="modal-message">Tem certeza que deseja sair do sistema?</p>
          <div class="modal-buttons">
            <button type="button" class="modal-btn modal-btn-cancel" id="modalCancel">
              Cancelar
            </button>
            <button type="button" class="modal-btn modal-btn-confirm" id="modalConfirm">
              Sim, Sair
            </button>
          </div>
        </div>
      </div>

      <!-- Logo direita -->
      <div class="nav-logo-right">
        <img src="/vports/res/vports/Marca_Vports-05%204.png"
            alt="Logo VPorts" class="logo-right">
      </div>
    </div>
  </nav>

  <div class="container">
    <header>
      <h1>Administração — Validação de Registros</h1>
      <p>Revise e valide os envios de <b>Embarcações</b> , <b>Desembarques</b> e <b> Pescadores </b> </p> 
    </header>

    <!-- Abas -->
    <div class="tabs" role="tablist" aria-label="Listas para validação">
      <button class="tab-btn active" data-tab="emb" role="tab" aria-selected="true">Embarcações</button>
      <button class="tab-btn" data-tab="des" role="tab" aria-selected="false">Desembarques</button>
      <button class="tab-btn" data-tab="pes" role="tab" aria-selected="false">Pescadores</button>
    </div>

    <div class="toolbar">
      <select id="statusFilter">
        <option value="">Todos os status</option>
        <option value="pending">Pendentes</option>
        <option value="approved">Aprovados</option>
        <option value="rejected">Reprovados</option>
      </select>
      <input id="search" class="search" type="text" placeholder="Buscar por nome, RGP, cidade, embarcação..." />
      <button id="exportJson" class="btn">Exportar JSON</button>
      <button id="exportCsv" class="btn">Exportar CSV</button>
      <button id="refresh" class="btn" title="Atualizar dados">🔄 Atualizar</button>
    </div>

    <div class="list">
      <table>
        <thead>
          <tr id="head-row">
            <!-- cabeçalho dinâmico -->
          </tr>
        </thead>
        <tbody id="rows">
          <!-- linhas -->
        </tbody>
      </table>
      <div id="loading" class="loading">Carregando dados...</div>
      <div id="error" class="error hidden"></div>
    </div>
  </div>

  <!-- Drawer de detalhes -->
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">
      <h3 id="drawerTitle">Detalhes</h3>
      <button id="closeDrawer" class="btn" style="background:#6c757d; color:white;">Fechar</button>
    </div>
    <div id="drawerBody"></div>
    <div class="footer-actions">
      <input id="reviewNote" type="text" placeholder="Motivo (opcional)" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:6px;"/>
      <button id="btnApprove" class="btn btn-approve">Aprovar</button>
      <button id="btnReject" class="btn btn-reject">Reprovar</button>
    </div>
  </aside>

  <!-- Overlay para quando o drawer estiver aberto -->
  <div id="drawerOverlay" class="drawer-overlay"></div>

  <!-- FORÇA OS SCRIPTS ESTAREM SEMPRE ATUALIZADOS -->
  <script>
    // Função para obter o timestamp atual
    function getTimestamp() {
        return new Date().getTime();
    }

    // Adicionando o timestamp aos scripts para evitar cache
    const scripts = [
        "../js/urls.js",      // Configurações de URLs primeiro
        "../form/navbar.js",
        "script.js",
        "../auth/logoutAdmin.js"
    ];

    scripts.forEach(script => {
        const scriptElement = document.createElement('script');
        scriptElement.src = script + '?v=' + getTimestamp();
        scriptElement.async = false; // Garantir que os scripts sejam carregados na ordem correta
        document.write(scriptElement.outerHTML); // Adiciona o script diretamente ao HTML
    });
  </script>
</body>
</html>
